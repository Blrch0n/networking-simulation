{
  "name": "mnfiber",
  "services": {
    "ulaanbaatar": {
      "image": "quay.io/frrouting/frr:10.5.5",
      "container_name": "mnfiber-ulaanbaatar",
      "profiles": [
        "lab"
      ],
      "cap_add": [
        "NET_ADMIN",
        "NET_RAW",
        "SYS_ADMIN"
      ],
      "sysctls": {
        "net.ipv4.ip_forward": "1",
        "net.ipv4.conf.all.rp_filter": "0",
        "net.ipv4.conf.default.rp_filter": "0"
      },
      "volumes": [
        "./lab/configs/ulaanbaatar/daemons:/etc/frr/daemons:ro",
        "./lab/configs/ulaanbaatar/frr.conf:/etc/frr/frr.conf:ro"
      ],
      "networks": {
        "ub-dar": {
          "interface_name": "eth1",
          "ipv4_address": "10.230.1.2"
        },
        "bul-ub": {
          "interface_name": "eth2",
          "ipv4_address": "10.230.4.3"
        }
      },
      "mem_limit": "256m",
      "cpus": 1
    },
    "darkhan": {
      "image": "quay.io/frrouting/frr:10.5.5",
      "container_name": "mnfiber-darkhan",
      "profiles": [
        "lab"
      ],
      "cap_add": [
        "NET_ADMIN",
        "NET_RAW",
        "SYS_ADMIN"
      ],
      "sysctls": {
        "net.ipv4.ip_forward": "1",
        "net.ipv4.conf.all.rp_filter": "0",
        "net.ipv4.conf.default.rp_filter": "0"
      },
      "volumes": [
        "./lab/configs/darkhan/daemons:/etc/frr/daemons:ro",
        "./lab/configs/darkhan/frr.conf:/etc/frr/frr.conf:ro"
      ],
      "networks": {
        "ub-dar": {
          "interface_name": "eth1",
          "ipv4_address": "10.230.1.3"
        },
        "dar-erd": {
          "interface_name": "eth2",
          "ipv4_address": "10.230.2.2"
        }
      },
      "mem_limit": "256m",
      "cpus": 1
    },
    "erdenet": {
      "image": "quay.io/frrouting/frr:10.5.5",
      "container_name": "mnfiber-erdenet",
      "profiles": [
        "lab"
      ],
      "cap_add": [
        "NET_ADMIN",
        "NET_RAW",
        "SYS_ADMIN"
      ],
      "sysctls": {
        "net.ipv4.ip_forward": "1",
        "net.ipv4.conf.all.rp_filter": "0",
        "net.ipv4.conf.default.rp_filter": "0"
      },
      "volumes": [
        "./lab/configs/erdenet/daemons:/etc/frr/daemons:ro",
        "./lab/configs/erdenet/frr.conf:/etc/frr/frr.conf:ro"
      ],
      "networks": {
        "dar-erd": {
          "interface_name": "eth1",
          "ipv4_address": "10.230.2.3"
        },
        "erd-bul": {
          "interface_name": "eth2",
          "ipv4_address": "10.230.3.2"
        }
      },
      "mem_limit": "256m",
      "cpus": 1
    },
    "bulgan": {
      "image": "quay.io/frrouting/frr:10.5.5",
      "container_name": "mnfiber-bulgan",
      "profiles": [
        "lab"
      ],
      "cap_add": [
        "NET_ADMIN",
        "NET_RAW",
        "SYS_ADMIN"
      ],
      "sysctls": {
        "net.ipv4.ip_forward": "1",
        "net.ipv4.conf.all.rp_filter": "0",
        "net.ipv4.conf.default.rp_filter": "0"
      },
      "volumes": [
        "./lab/configs/bulgan/daemons:/etc/frr/daemons:ro",
        "./lab/configs/bulgan/frr.conf:/etc/frr/frr.conf:ro"
      ],
      "networks": {
        "erd-bul": {
          "interface_name": "eth1",
          "ipv4_address": "10.230.3.3"
        },
        "bul-ub": {
          "interface_name": "eth2",
          "ipv4_address": "10.230.4.2"
        }
      },
      "mem_limit": "256m",
      "cpus": 1
    }
  },
  "networks": {
    "ub-dar": {
      "internal": true,
      "driver": "bridge",
      "ipam": {
        "config": [
          {
            "subnet": "10.230.1.0/29"
          }
        ]
      }
    },
    "dar-erd": {
      "internal": true,
      "driver": "bridge",
      "ipam": {
        "config": [
          {
            "subnet": "10.230.2.0/29"
          }
        ]
      }
    },
    "erd-bul": {
      "internal": true,
      "driver": "bridge",
      "ipam": {
        "config": [
          {
            "subnet": "10.230.3.0/29"
          }
        ]
      }
    },
    "bul-ub": {
      "internal": true,
      "driver": "bridge",
      "ipam": {
        "config": [
          {
            "subnet": "10.230.4.0/29"
          }
        ]
      }
    }
  }
}
